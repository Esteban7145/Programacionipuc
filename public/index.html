<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ Moda | Boutique Premium</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="brand">AZ Moda</div>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#checkout">Checkout</a>
      <a href="/admin.html">Admin</a>
    </nav>
    <button id="openCartBtn" class="btn btn-dark">Carrito (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero">
    <div>
      <h1>Elegancia a medida</h1>
      <p>Vestidos exclusivos, hoodies premium y piezas personalizadas con el estilo AZ Moda.</p>
    </div>
  </section>

  <main>
    <section class="filters" id="catalogo">
      <input type="text" id="searchInput" placeholder="Buscar producto..." />
      <select id="categoryFilter">
        <option value="">Todas las categorías</option>
        <option>Vestidos</option>
        <option>Hoodies</option>
        <option>Personalizados</option>
        <option>Bordados</option>
      </select>
      <select id="sizeFilter">
        <option value="">Todas las tallas</option>
        <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
      </select>
      <input type="number" id="minPrice" placeholder="Precio mín" min="0" />
      <input type="number" id="maxPrice" placeholder="Precio máx" min="0" />
      <button class="btn" id="applyFiltersBtn">Filtrar</button>
    </section>

    <section>
      <h2>Productos destacados</h2>
      <div id="productsGrid" class="grid"></div>
    </section>

    <section id="checkout" class="checkout">
      <h2>Checkout</h2>
      <form id="checkoutForm">
        <input name="fullName" placeholder="Nombre completo" required />
        <input name="email" type="email" placeholder="Correo" required />
        <input name="phone" placeholder="Teléfono" required />
        <input name="address" placeholder="Dirección" required />
        <textarea name="notes" placeholder="Notas"></textarea>
        <button class="btn btn-dark" type="submit">Confirmar pedido</button>
      </form>
      <p id="checkoutResult"></p>
    </section>
  </main>

  <aside id="cartDrawer" class="drawer hidden">
    <h3>Tu carrito</h3>
    <div id="cartItems"></div>
    <p>Subtotal: $<span id="subtotal">0.00</span></p>
    <p>Total: $<span id="total">0.00</span></p>
    <button id="closeCartBtn" class="btn">Cerrar</button>
  </aside>

  <script src="/js/app.js"></script>
</body>
</html>
